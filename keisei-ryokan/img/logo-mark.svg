<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="渓声館のロゴマーク">
  <!-- 渓声館 ロゴマーク：山並みと渓流と湯けむり（ポートフォリオ用の架空のロゴ） -->
  <g fill="none" stroke="#e6c88f" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="30" stroke-width="1.6"/>
    <circle cx="32" cy="32" r="26.5" stroke-width=".8" opacity=".6"/>
    <!-- 湯けむり -->
    <path d="M27 9.5c-1.6 1.8 1.6 3.2 0 5" stroke-width="1.4"/>
    <path d="M32 7.5c-1.6 1.8 1.6 3.2 0 5" stroke-width="1.4"/>
    <path d="M37 9.5c-1.6 1.8 1.6 3.2 0 5" stroke-width="1.4"/>
    <!-- 山並み -->
    <path d="M9 36 L22 20 L29 28 L36 18 L55 36" stroke-width="2"/>
    <path d="M33 21.5 L36 18 L39 22" stroke-width="1.2" opacity=".8"/>
    <!-- 渓流 -->
    <path d="M12 42c5-3 9 3 14 0s9 3 14 0s9 3 12 0" stroke-width="1.8"/>
    <path d="M15 48c4.5-2.6 8 2.6 12.5 0s8 2.6 12.5 0s7 2.6 9 0" stroke-width="1.4" opacity=".75"/>
    <path d="M20 53.5c4-2 7 2 11 0s7 2 11 0" stroke-width="1.1" opacity=".55"/>
  </g>
</svg>
